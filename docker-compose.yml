# Sobe o MySQL e a API juntos:  docker compose up --build
# As senhas abaixo são só para desenvolvimento local.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agenda_consultas
      MYSQL_USER: agenda
      MYSQL_PASSWORD: agenda123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagenda", "-pagenda123"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://agenda:agenda123@mysql:3306/agenda_consultas
      CARREGAR_DADOS_EXEMPLO: "true"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  dados_mysql:
